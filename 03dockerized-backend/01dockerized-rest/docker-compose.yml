version: "3.9"

services:
  api:
    build: .
    container_name: rest-api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      - db
    volumes:
      - .:/app
      # これはふつうにバインドマウント
      - /app/node_modules
      # これは匿名ボリューム。macとlinuxのOSに依存するnpm系のものをうまく動くようにしている。

  db:
    image: postgres:15
    container_name: rest-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: